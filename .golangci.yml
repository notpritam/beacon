# Beacon golangci-lint config (v2 schema) — strict-but-not-noisy baseline.
version: "2"

run:
  timeout: 3m

linters:
  # Start from the standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # and add the extras that matter for a remote-control tool.
  default: standard
  enable:
    - misspell   # typos in comments/strings
    - revive     # style/lint
    - bodyclose  # HTTP response bodies closed
    - gosec      # security issues — important here

formatters:
  # gofmt is a formatter in v2, not a linter.
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
